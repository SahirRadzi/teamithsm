<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team IT HSM</title>
    <link rel="stylesheet" href="style.css">


</head>


<body>

   <div class="container">
    <img src="images/teamithsm_logo.png" class="logo" alt="">

    <div class="content">
        <p>WebPortal TeamIT | HSM sedang Selenggara.</p>

        <h1><span>Pra Peluncuran</span> akan datang</h1>
        <div class="launch-time">
            <div>
                <p id="hari">00</p>
                <span>Hari</span>
            </div>
            <div>
                <p id="jam">00</p>
                <span>Jam</span>
            </div>
            <div>
                <p id="minit">00</p>
                <span>Minit</span>
            </div>
            <div>
                <p id="saat">00</p>
                <span>Saat</span>
            </div>
        </div>

        <button type="button">Seterusnya <img src="images/triangle.png"></button>
    </div>

    <img src="images/rocket.png" class="rocket" >
   </div>



   <script>
    var countDownDate = new Date("December 1, 2026 00:00:00").getTime();
    var x = setInterval(function(){
        var now = new Date().getTime();
        var distance = countDownDate - now;

        var hari = Math.floor(distance / (1000 * 60 * 60 * 24));
        var jam = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minit = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var saat = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("hari").innerHTML = hari;
        document.getElementById("jam").innerHTML = jam;
        document.getElementById("minit").innerHTML = minit;
        document.getElementById("saat").innerHTML = saat;

        if(distance < 0){
            clearInterval(x);
            document.getElementById("hari").innerHTML = "00";
            document.getElementById("jam").innerHTML = "00";
            document.getElementById("minit").innerHTML = "00";
            document.getElementById("saat").innerHTML = "00";
        }

    },1000);

   </script>

   
    
</body>
</html>
